name: ANDROID BUILD 64 Bits

on:
  workflow_dispatch:
  push:
    branches: [android, main, develop]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-2ship-o2r:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.13
        with:
          key: ${{ runner.os }}-o2r-${{ github.sha }}
          restore-keys: ${{ runner.os }}-o2r-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool ninja-build

      - name: Build SDL 2.28.5
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
          tar -xzf SDL2-2.28.5.tar.gz
          cd SDL2-2.28.5
          ./configure --enable-hidapi-libusb
          make -j"$(nproc)"
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Build tinyxml2 10.0.0
        run: |
          sudo apt-get remove -y libtinyxml2-dev
          wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz
          cd tinyxml2-10.0.0
          cmake -S . -B build
          cmake --build build --parallel
          sudo cmake --install build

      - name: Generate 2ship.o2r
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake --no-warn-unused-cli -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --config Release --target Generate2ShipOtr --parallel 3

      - name: Upload 2ship.o2r
        uses: actions/upload-artifact@v4
        with:
          name: 2ship.o2r
          path: 2ship.o2r
          if-no-files-found: error
          retention-days: 1

  build-apk:
    needs: generate-2ship-o2r
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download 2ship.o2r
        uses: actions/download-artifact@v4
        with:
          name: 2ship.o2r
          path: Android/app/src/main/assets

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # OJO: "cmake;3.28.3" NO existe en sdkmanager (era el error de tu log anterior).
          sdkmanager --install "platforms;android-33" "build-tools;34.0.0" "ndk;26.0.10792818"

      - name: Install CMake 3.28.3 + Ninja (el CMake raiz exige >= 3.26)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz
          tar -xzf cmake-3.28.3-linux-x86_64.tar.gz -C "$HOME"
          CMAKE_HOME="$HOME/cmake-3.28.3-linux-x86_64"
          cp "$(which ninja)" "$CMAKE_HOME/bin/ninja"
          echo "cmake.dir=$CMAKE_HOME" >> Android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> Android/local.properties
          "$CMAKE_HOME/bin/cmake" --version

      - name: Verify build tools
        run: |
          java -version
          cat Android/local.properties
          chmod +x Android/gradlew

      - name: Build APK (arm64-v8a)
        working-directory: Android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2ship-android-arm64
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
